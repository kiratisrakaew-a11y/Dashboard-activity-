<script>
(function () {
  'use strict';
  var D = null;               // dashboard payload
  var charts = {};
  var caseFilter = { buyer: '', dept: '', method: '', status: 'OPEN', flag: '', q: '' };
  var methodScope = 'OPEN';   // กราฟสัดส่วน NORMAL/SPECIAL: OPEN | ALL
  var lastDrill = null;
  var rankPeriod = { unit: 'month', date: '' };   // หน้า "จัดอันดับ" (date ว่าง = วันนี้)
  try { var rp = JSON.parse(localStorage.getItem('dash.rankPeriod') || 'null'); if (rp && rp.unit) rankPeriod = rp; } catch (e) {}       // รายการล่าสุดที่เปิดจากกราฟ (ใช้ปุ่ม "กลับไปรายการ")

  // ---------------- helpers ----------------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n, d) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '–';
    return Number(n).toLocaleString('th-TH', { maximumFractionDigits: d === undefined ? 0 : d });
  }
  function baht(n) { return n == null ? '–' : '฿' + fmt(n); }
  function nameOf(email) {
    var b = (D.buyers || []).filter(function (x) { return x.email === email; })[0];
    return b ? b.name : (email ? String(email).split('@')[0] : '–');
  }
  function label(list, code) {
    var l = D.lists && D.lists[list];
    return l && l[code] ? l[code] : code;
  }
  function gradeBadge(score, grade, stale) {
    if (score === null || score === undefined) return '<span class="badge">ยังไม่ตรวจ</span>';
    return '<span class="badge grade-' + esc(grade) + '" title="' + (stale ? 'เนื้อหา/เกณฑ์เปลี่ยน รอตรวจใหม่' : '') + '">' +
      esc(grade) + ' · ' + fmt(score) + (stale ? ' *' : '') + '</span>';
  }
  function scoreClass(s) {
    if (s == null) return '';
    return s >= 70 ? 'good' : s >= D.settings.SCORE_THRESHOLD ? 'warn' : 'bad';
  }
  function sheetLink(sheet, row, text) {
    var gid = D.meta.gids[sheet];
    var url = D.meta.url + '#gid=' + gid + (row ? '&range=A' + row : '');
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text || ('แถว ' + row)) + '</a>';
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add('hidden'); }, 3500);
  }
  function call(fn, args) {
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args || []);
    });
  }
  function kpi(lbl, value, hint, cls, onClickTab) {
    return '<div class="card kpi ' + (cls || '') + (onClickTab ? ' clickable" data-goto="' + onClickTab : '') + '">' +
      '<div class="label">' + esc(lbl) + '</div><div class="value">' + value + '</div>' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function chart(id, cfg) {
    if (charts[id]) charts[id].destroy();
    var el = $(id); if (!el || !window.Chart) return;
    Chart.defaults.color = cssVar('--muted');
    Chart.defaults.borderColor = cssVar('--border');
    Chart.defaults.font.family = "'IBM Plex Sans Thai', system-ui, sans-serif";
    charts[id] = new Chart(el, cfg);
  }
  function sortedEntries(obj) {
    return Object.keys(obj || {}).map(function (k) { return [k, obj[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }
  /** ทำให้กราฟคลิกได้: onPick(index, datasetIndex) เมื่อคลิกแท่ง/ชิ้น/จุด */
  function pickable(cfg, onPick) {
    cfg.options = cfg.options || {};
    cfg.options.onClick = function (evt, els) { if (els && els.length) onPick(els[0].index, els[0].datasetIndex); };
    cfg.options.onHover = function (evt, els) {
      var t = evt.native && evt.native.target; if (t) t.style.cursor = els && els.length ? 'pointer' : 'default';
    };
    return cfg;
  }
  function hbar(id, obj, labeler, onPick) {
    var e = sortedEntries(obj);
    var cfg = { type: 'bar', data: { labels: e.map(function (x) { return labeler ? labeler(x[0]) : x[0]; }),
      datasets: [{ data: e.map(function (x) { return x[1]; }), backgroundColor: cssVar('--accent'), borderRadius: 4 }] },
      options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { ticks: { precision: 0 } } } } };
    chart(id, onPick ? pickable(cfg, function (i) { onPick(e[i][0]); }) : cfg);
  }
  /** ค่าว่างถูกนับเป็น "(ว่าง)" ฝั่ง server (countBy_) — เทียบให้ตรงกัน */
  function keyOf(v) { return (v === null || v === undefined || String(v).trim() === '') ? '(ว่าง)' : String(v); }

  // ---------------- tabs ----------------
  function showTab(name) {
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
    document.querySelectorAll('.tab').forEach(function (s) { s.classList.toggle('hidden', s.id !== 'tab-' + name); });
    try { localStorage.setItem('dash.tab', name); } catch (e) {}
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) showTab(b.dataset.tab);
  });
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-goto]');
    if (g) {
      var parts = g.dataset.goto.split(':');
      if (parts[1] !== undefined) { caseFilter.flag = parts[1]; caseFilter.status = parts[2] !== undefined ? parts[2] : 'OPEN'; renderCases(); }
      showTab(parts[0]);
    }
    var c = e.target.closest('[data-case]');
    if (c) { if (c.tagName === 'A') e.preventDefault(); openCase(c.dataset.case); }
    var rv = e.target.closest('[data-review]');
    if (rv) reviewNow(rv.dataset.review, rv);
    var rc = e.target.closest('[data-review-case]');
    if (rc) reviewCaseNow(rc.dataset.reviewCase, rc);
  });

  // ---------------- overview ----------------
  function renderOverview() {
    var o = D.overview, ai = D.ai;
    var h = '<div class="grid kpis">' +
      kpi('Case เปิดอยู่', fmt(o.openCases), 'ทั้งหมด ' + fmt(o.totalCases) + ' · ใหม่ 7 วัน ' + fmt(o.newCases7d), '', 'cases::OPEN') +
      kpi('Next action เลยกำหนด', fmt(o.overdueNextActions), 'ลืมติ๊ก Done ' + fmt(o.forgotDone) + ' · ครบกำหนดวันนี้/พรุ่งนี้ ' + fmt(o.dueSoon), o.overdueNextActions ? 'bad' : 'good') +
      kpi('Case นิ่ง > ' + D.settings.STALE_DAYS + ' วัน', fmt(o.staleCases), 'ไม่มี Activity เลย ' + fmt(o.noActivityCases), o.staleCases ? 'warn' : 'good', 'cases:stale:OPEN') +
      kpi('สรุปผลแล้วแต่ยัง OPEN', fmt(o.closedButOpen), 'รอปิด Case / ออก PR', o.closedButOpen ? 'warn' : '', 'cases:closedButOpen:OPEN') +
      kpi('เลย Required Date', fmt(o.pastRequired), 'อายุ Case เฉลี่ย ' + fmt(o.avgCaseAge, 1) + ' วัน', o.pastRequired ? 'bad' : '', 'cases:pastRequired:OPEN') +
      kpi('คะแนนการเขียน (AI)', o.avgScore == null ? '–' : fmt(o.avgScore, 1), 'ตรวจแล้ว ' + fmt(ai.reviewed) + ' · รอ ' + fmt(ai.pending), scoreClass(o.avgScore), 'ai') +
      kpi('Savings ที่ต่อรองได้', baht(o.savingsTotal), o.savingsPct == null ? 'ยังไม่มีข้อมูลราคา' : fmt(o.savingsPct, 2) + '% จาก ' + fmt(o.savingsCases) + ' Case', 'good') +
      kpi('รับงานถึง Activity แรก', o.avgFirstResponseDays == null ? '–' : fmt(o.avgFirstResponseDays, 1) + ' วัน', 'ค่าเฉลี่ยทุก Case') +
      '</div>';

    h += '<div class="grid cols-2" style="margin-top:12px">' +
      '<div class="card"><h3>Case เปิดอยู่ตาม Buyer</h3><div class="chart-box"><canvas id="chBuyer"></canvas></div></div>' +
      '<div class="card"><div class="card-head"><h3>สัดส่วน Case NORMAL / SPECIAL</h3><div class="seg" id="methodScope">' +
        '<button data-scope="OPEN" class="' + (methodScope === 'OPEN' ? 'active' : '') + '">เปิดอยู่</button>' +
        '<button data-scope="ALL" class="' + (methodScope === 'ALL' ? 'active' : '') + '">ทั้งหมด</button></div></div>' +
        '<div class="chart-box"><canvas id="chMethod"></canvas></div></div>' +
      '<div class="card"><h3>แนวโน้มรายสัปดาห์</h3><div class="chart-box"><canvas id="chWeekly"></canvas></div></div>' +
      '<div class="card"><h3>Case เปิดอยู่ตามแผนก</h3><div class="chart-box"><canvas id="chDept"></canvas></div></div>' +
      '<div class="card"><h3>ขั้นตอนของ Case ที่เปิดอยู่</h3><div class="chart-box"><canvas id="chFunnel"></canvas></div></div>' +
      '<div class="card"><h3>Budget Type</h3><div class="chart-box"><canvas id="chBudget"></canvas></div></div>' +
      '<div class="card"><h3>ช่องทางที่ใช้ติดต่อ</h3><div class="chart-box"><canvas id="chChannel"></canvas></div></div>' +
      '<div class="card"><h3>ต่อรองได้ (บาท) ตาม Buyer</h3><div class="chart-box"><canvas id="chNegoOverview"></canvas></div></div>' +
      '<div class="card"><h3>% ที่ต่อรองลดลงได้ ตาม Buyer</h3><div class="chart-box"><canvas id="chNegoPctOverview"></canvas></div></div>' +
      '</div><p class="small muted">👆 คลิกที่แท่ง / ชิ้นของกราฟเพื่อดูรายการ Case หรือ Activity เบื้องหลังตัวเลข แล้วคลิกแถวเพื่อเปิดรายละเอียด Case</p>';

    h += '<h2>Next action ที่เลยกำหนด</h2>' + nextActionTable(D.nextActions.overdue, 'ไม่มีรายการเลยกำหนด 🎉');
    h += '<h2>ครบกำหนดวันนี้ / พรุ่งนี้</h2>' + nextActionTable(D.nextActions.dueSoon, 'ไม่มี');
    $('tab-overview').innerHTML = h;

    function openOf(fn) { return D.cases.filter(function (c) { return c.status === 'OPEN' && fn(c); }); }
    hbar('chBuyer', D.breakdown.byBuyer, nameOf, function (k) {
      drill('Case เปิดอยู่ของ ' + nameOf(k), openOf(function (c) { return keyOf(c.buyer) === k; }), 'case', { buyer: k === '(ว่าง)' ? '' : k });
    });
    hbar('chDept', D.breakdown.byDept, function (c) { return c + ' · ' + label('DEPARTMENT', c); }, function (k) {
      drill('Case เปิดอยู่ แผนก ' + k + ' · ' + label('DEPARTMENT', k), openOf(function (c) { return keyOf(c.dept) === k; }), 'case', { dept: k === '(ว่าง)' ? '' : k });
    });
    hbar('chChannel', D.breakdown.byChannel, null, function (k) {
      drill('Activity ที่ติดต่อทาง ' + k, D.activities.filter(function (a) { return keyOf(a.channel) === k; }), 'activity');
    });
    renderNegoChart('chNegoOverview', drillNego);
    renderNegoPctChart('chNegoPctOverview', drillNego);
    renderMethodChart();
    $('methodScope').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      methodScope = b.dataset.scope;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
      renderMethodChart();
    });
    var be = sortedEntries(D.breakdown.byBudget);
    var palette = [cssVar('--accent'), cssVar('--good'), cssVar('--warn'), cssVar('--bad'), cssVar('--muted')];
    chart('chBudget', pickable({ type: 'doughnut', data: { labels: be.map(function (x) { return x[0]; }),
      datasets: [{ data: be.map(function (x) { return x[1]; }), backgroundColor: palette, borderColor: cssVar('--surface') }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' }, tooltip: { callbacks: { label: pctLabel } } } } },
    function (i) {
      var k = be[i][0];
      drill('Case เปิดอยู่ Budget ' + k, openOf(function (c) { return keyOf(c.budget) === k; }), 'case');
    }));
    chart('chFunnel', pickable({ type: 'bar', data: { labels: D.funnel.map(function (f) { return f.label; }),
      datasets: [{ data: D.funnel.map(function (f) { return f.count; }), backgroundColor: cssVar('--accent'), borderRadius: 4 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { precision: 0 } } } } },
    function (i) {
      var f = D.funnel[i];
      drill('Case เปิดอยู่ ขั้น ' + f.label, openOf(function (c) { return c.stage === f.stage; }), 'case');
    }));
    chart('chWeekly', pickable({ type: 'bar', data: { labels: D.weekly.map(function (w) { return w.week; }), datasets: [
      { label: 'Activity', data: D.weekly.map(function (w) { return w.activities; }), backgroundColor: cssVar('--accent'), borderRadius: 4, yAxisID: 'y' },
      { label: 'Case ใหม่', data: D.weekly.map(function (w) { return w.newCases; }), backgroundColor: cssVar('--muted'), borderRadius: 4, yAxisID: 'y' },
      { label: 'คะแนน AI', type: 'line', data: D.weekly.map(function (w) { return w.avgScore; }), borderColor: cssVar('--good'), backgroundColor: cssVar('--good'), yAxisID: 'y2', spanGaps: true }
    ] }, options: { maintainAspectRatio: false, scales: { y: { ticks: { precision: 0 } }, y2: { position: 'right', min: 0, max: 100, grid: { display: false } } } } },
    function (i, ds) {
      var wk = D.weekly[i].week;
      if (ds === 1) return drill('Case ที่รับเข้ามาในสัปดาห์ ' + wk, D.cases.filter(function (c) { return c.week === wk; }), 'case');
      var acts = D.activities.filter(function (a) { return a.week === wk; });
      if (ds === 2) {
        acts = acts.filter(function (a) { return a.score != null; }).sort(function (a, b) { return a.score - b.score; });
        return drill('Activity ที่ AI ตรวจแล้ว สัปดาห์ ' + wk + ' (คะแนนต่ำก่อน)', acts, 'activity', null, true);
      }
      drill('Activity ในสัปดาห์ ' + wk, acts, 'activity');
    }));
  }

  /** tooltip ของ doughnut: จำนวน + % */
  function pctLabel(ctx) {
    var total = ctx.dataset.data.reduce(function (s, v) { return s + v; }, 0);
    return ' ' + ctx.label + ': ' + fmt(ctx.parsed) + ' (' + (total ? fmt(ctx.parsed / total * 100, 1) : 0) + '%)';
  }

  function renderMethodChart() {
    var src = methodScope === 'ALL' ? (D.breakdown.byMethodAll || {}) : D.breakdown.byMethod;
    var order = ['NORMAL', 'SPECIAL'];
    var keys = order.filter(function (k) { return src[k]; })
      .concat(Object.keys(src).filter(function (k) { return order.indexOf(k) < 0; }));
    var total = keys.reduce(function (s, k) { return s + src[k]; }, 0);
    var colors = { NORMAL: cssVar('--accent'), SPECIAL: cssVar('--warn') };
    chart('chMethod', pickable({ type: 'doughnut', data: {
      labels: keys.map(function (k) {
        return (k === '(ว่าง)' ? k : k + ' · ' + label('METHOD', k)) + ' — ' + fmt(src[k]) + ' (' + (total ? fmt(src[k] / total * 100, 0) : 0) + '%)';
      }),
      datasets: [{ data: keys.map(function (k) { return src[k]; }),
        backgroundColor: keys.map(function (k) { return colors[k] || cssVar('--muted'); }), borderColor: cssVar('--surface') }] },
      options: { maintainAspectRatio: false, cutout: '55%', plugins: { legend: { position: 'bottom' },
        tooltip: { callbacks: { label: function (ctx) { return ' ' + ctx.label; } } } } } },
    function (i) {
      var k = keys[i];
      var list = D.cases.filter(function (c) { return keyOf(c.method) === k && (methodScope === 'ALL' || c.status === 'OPEN'); });
      drill('Case ' + k + (methodScope === 'ALL' ? ' (ทั้งหมด)' : ' ที่เปิดอยู่'), list, 'case',
        { method: k === '(ว่าง)' ? '' : k, status: methodScope === 'ALL' ? '' : 'OPEN' });
    }));
  }

  /** คลิกกราฟต่อรองตาม Buyer → รายการต่อรองของคนนั้น (email = null → ทั้งทีม) */
  function drillNego(email) {
    lastDrill = { nego: email };
    var h;
    if (email) {
      h = negoCaseTable(email);
    } else {
      var list = D.cases.filter(function (c) { return c.savings; }).sort(function (a, b) { return b.savings.saving - a.savings.saving; });
      h = '<div class="card table-wrap"><table><thead><tr><th>Case</th><th>เรื่อง</th><th>Buyer</th><th class="num">ราคาตั้งต้น</th>' +
        '<th class="num">ราคาสุดท้าย</th><th class="num">ลดได้ (บาท)</th><th class="num">% ลดลง</th></tr></thead><tbody>' +
        list.map(function (c) {
          var s = c.savings;
          return '<tr class="clickable" data-case="' + esc(c.id) + '"><td>' + esc(c.id) + '</td><td class="small">' + esc(c.ref) + '</td><td>' + esc(nameOf(c.buyer)) + '</td>' +
            '<td class="num">' + baht(s.initial) + '</td><td class="num">' + baht(s.final) + '</td><td class="num"><b>' + baht(s.saving) + '</b></td><td class="num">' + pctTxt(s.pct) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    openDrawer(email ? 'ผลการต่อรอง · ' + nameOf(email) : 'ผลการต่อรอง · รวมทั้งทีม', h);
  }

  function openDrawer(title, html) {
    $('drawerTitle').textContent = title;
    $('drawerBody').innerHTML = html;
    $('drawerBody').scrollTop = 0;
    $('drawer').classList.remove('hidden'); $('scrim').classList.remove('hidden');
  }

  /**
   * แสดงรายการเบื้องหลังตัวเลขในกราฟ (ใน drawer)
   * kind: 'case' | 'activity' · filter: ค่าที่ใช้กับแท็บ Cases (ถ้ามี) · keepOrder: ไม่ต้องเรียงใหม่
   */
  function drill(title, rows, kind, filter, keepOrder) {
    lastDrill = { title: title, rows: rows, kind: kind, filter: filter, keepOrder: keepOrder };
    var h = '<div class="drill-head"><span class="muted">' + fmt(rows.length) + ' รายการ</span>' +
      (filter ? '<button class="btn ghost" id="drillToCases">ดูในแท็บ Cases →</button>' : '') + '</div>';
    if (!rows.length) {
      h += '<div class="card muted">ไม่มีรายการ</div>';
    } else if (kind === 'case') {
      var cs = keepOrder ? rows : rows.slice().sort(function (a, b) { return (b.ageDays || 0) - (a.ageDays || 0); });
      h += '<div class="card table-wrap"><table><thead><tr><th>Case</th><th>เรื่อง</th><th>Buyer</th><th>ขั้นตอน</th>' +
        '<th class="num">อายุ (วัน)</th><th class="num">ล่าสุด (วันก่อน)</th><th>คะแนน AI</th></tr></thead><tbody>' +
        cs.map(function (c) {
          return '<tr class="clickable" data-case="' + esc(c.id) + '"><td>' + esc(c.id) +
            '<div class="small"><span class="badge ' + (c.method === 'SPECIAL' ? 'warn' : 'info') + '">' + esc(c.method || '–') + '</span> ' +
            '<span class="muted">' + esc(c.status) + '</span></div></td>' +
            '<td class="desc">' + esc(c.ref) + '<div class="small muted">' + esc(c.dept) + ' · ' + esc(c.budget) + '</div></td>' +
            '<td>' + esc(nameOf(c.buyer)) + '</td><td>' + esc(c.stageLabel) + '</td>' +
            '<td class="num">' + fmt(c.ageDays) + '</td><td class="num">' + (c.daysSinceLast == null ? '–' : fmt(c.daysSinceLast)) + '</td>' +
            '<td>' + (c.avgScore == null ? '<span class="muted">–</span>' : '<span class="badge ' + scoreClass(c.avgScore) + '">' + fmt(c.avgScore, 1) + '</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      var as = keepOrder ? rows : rows.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      h += '<div class="card table-wrap"><table><thead><tr><th>วันที่</th><th>Case</th><th>ประเภท</th><th>ช่องทาง</th><th>Buyer</th>' +
        '<th>รายละเอียด</th><th>คะแนน AI</th></tr></thead><tbody>' +
        as.map(function (a) {
          var d = a.desc.length > 90 ? a.desc.slice(0, 90) + '…' : a.desc;
          return '<tr class="clickable" data-case="' + esc(a.caseId) + '"><td class="small">' + esc(String(a.date).slice(0, 10)) + '</td>' +
            '<td>' + esc(a.caseId) + '<div class="small muted">' + esc(a.method) + '</div></td>' +
            '<td><span class="badge info">' + esc(a.type) + '</span></td><td class="small">' + esc(a.channel || '–') + '</td>' +
            '<td>' + esc(nameOf(a.by)) + '</td><td class="small">' + esc(d) + '</td>' +
            '<td>' + gradeBadge(a.score, a.grade, a.reviewStale) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    openDrawer(title, h);
    var go = $('drillToCases');
    if (go) go.addEventListener('click', function () {
      caseFilter = { buyer: '', dept: '', method: '', status: 'OPEN', flag: '', q: '' };
      Object.keys(filter).forEach(function (k) { caseFilter[k] = filter[k]; });
      closeDrawer(); renderCases(); showTab('cases');
    });
  }
  function reopenDrill() {
    var d = lastDrill; if (!d) return;
    if (d.nego !== undefined) drillNego(d.nego);
    else drill(d.title, d.rows, d.kind, d.filter, d.keepOrder);
  }

  function nextActionTable(list, empty) {
    if (!list.length) return '<div class="card muted">' + empty + '</div>';
    return '<div class="card table-wrap"><table><thead><tr><th>Case</th><th>Activity</th><th>Next action</th><th>กำหนด</th><th class="num">เลย (วัน)</th><th>Buyer</th></tr></thead><tbody>' +
      list.map(function (o) {
        return '<tr class="clickable" data-case="' + esc(o.caseId) + '"><td>' + esc(o.caseId) + '</td><td>' + esc(o.id) + '</td><td>' + esc(o.nextAction) +
          '</td><td>' + esc(o.nextDate) + '</td><td class="num">' + (o.daysLate > 0 ? fmt(o.daysLate) : '–') + '</td><td>' + esc(nameOf(o.by)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ---------------- จัดอันดับ ----------------
  function dayOf(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000 : null; }
  function isoOf(d) { return new Date(d * 86400000).toISOString().slice(0, 10); }
  function thDate(d, opt) { return new Date(d * 86400000).toLocaleDateString('th-TH', Object.assign({ timeZone: 'UTC' }, opt)); }
  /** ช่วงวันที่ของตัวกรอง (เลขวัน) — สัปดาห์เริ่มวันจันทร์ เหมือน weekStart_ ฝั่ง server */
  function periodRange(p) {
    if (p.unit === 'all') return null;
    var d = dayOf(p.date || D.today);
    if (p.unit === 'day') return { from: d, to: d, unit: 'day' };
    if (p.unit === 'week') { var w = d - ((d + 3) % 7); return { from: w, to: w + 6, unit: 'week' }; }
    var dt = new Date(d * 86400000), y = dt.getUTCFullYear(), m = dt.getUTCMonth();
    return { from: Date.UTC(y, m, 1) / 86400000, to: Date.UTC(y, m + 1, 0) / 86400000, unit: 'month' };
  }
  function periodText(r) {
    if (!r) return 'ทั้งหมด';
    if (r.unit === 'day') return thDate(r.from, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    if (r.unit === 'month') return thDate(r.from, { month: 'long', year: 'numeric' });
    return thDate(r.from, { day: 'numeric', month: 'short' }) + ' – ' + thDate(r.to, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function shiftPeriod(step) {
    var d = dayOf(rankPeriod.date || D.today);
    if (rankPeriod.unit === 'day') d += step;
    else if (rankPeriod.unit === 'week') d += 7 * step;
    else { var dt = new Date(d * 86400000); d = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + step, 1) / 86400000; }
    rankPeriod.date = isoOf(d);
  }
  var BASIS_LABEL = { final: 'ราคาสุดท้าย', initial: 'ราคาเสนอแรก (ยังไม่มีราคาสุดท้าย)', estimate: 'ราคาประมาณการ (ยังไม่มีราคาจาก Vendor)' };

  function renderRanking() {
    try { localStorage.setItem('dash.rankPeriod', JSON.stringify(rankPeriod)); } catch (e) {}
    var r = periodRange(rankPeriod);
    var inPeriod = D.cases.filter(function (c) {
      if (!r) return true;
      var d = dayOf(c.rankDate); return d !== null && d >= r.from && d <= r.to;
    });
    var valued = inPeriod.filter(function (c) { return c.value; });
    var saved = inPeriod.filter(function (c) { return c.savings; });
    var totalValue = valued.reduce(function (s, c) { return s + c.value.value; }, 0);
    var totalSaving = saved.reduce(function (s, c) { return s + c.savings.saving; }, 0);
    var totalInitial = saved.reduce(function (s, c) { return s + c.savings.initial * c.savings.quantity; }, 0);
    var units = [['day', 'วัน'], ['week', 'สัปดาห์'], ['month', 'เดือน'], ['all', 'ทั้งหมด']];

    var h = '<div class="filters"><div class="seg" id="rankUnit">' + units.map(function (u) {
        return '<button data-unit="' + u[0] + '" class="' + (rankPeriod.unit === u[0] ? 'active' : '') + '">' + u[1] + '</button>';
      }).join('') + '</div>' +
      (r ? '<button class="btn ghost" id="rankPrev" title="ช่วงก่อนหน้า">◀</button>' +
        '<input type="date" id="rankDate" value="' + esc(rankPeriod.date || D.today) + '">' +
        '<button class="btn ghost" id="rankNext" title="ช่วงถัดไป">▶</button>' +
        '<button class="btn ghost" id="rankToday">วันนี้</button>' : '') +
      '<span class="period-label">' + esc(periodText(r)) + '</span></div>';
    h += '<div class="grid kpis">' +
      kpi('Case ในช่วงนี้', fmt(inPeriod.length), 'มีมูลค่า ' + fmt(valued.length) + ' · ยังไม่มีราคา ' + fmt(inPeriod.length - valued.length)) +
      kpi('มูลค่ารวม', baht(round2(totalValue)), 'ราคาสุดท้าย (ถ้ายังไม่มีใช้ราคาเสนอแรก/ประมาณการ)') +
      kpi('ต่อรองลดได้รวม', baht(round2(totalSaving)), 'จาก ' + fmt(saved.length) + ' Case ที่มีราคาก่อน–หลังต่อรอง', 'good') +
      kpi('% ลดลง', totalInitial ? fmt(totalSaving / totalInitial * 100, 2) + '%' : '–', 'ถ่วงน้ำหนักด้วยยอดเงิน') +
      '</div>';
    var sortBy = rankPeriod.sort === 'saving' ? 'saving' : 'value';
    h += '<div class="card" style="margin-top:12px"><div class="card-head"><h3>Top 10 Case — มูลค่า และยอดที่ต่อรองลดได้</h3>' +
        '<div><span class="small muted">เรียงตาม </span><div class="seg" id="rankSort">' +
        '<button data-sort="value" class="' + (sortBy === 'value' ? 'active' : '') + '">มูลค่า Case</button>' +
        '<button data-sort="saving" class="' + (sortBy === 'saving' ? 'active' : '') + '">ยอดที่ลดได้</button></div></div></div>' +
        '<div class="chart-box" style="height:440px"><canvas id="chRank"></canvas></div>' +
        '<div class="small muted"><span class="legend-dot" style="background:' + cssVar('--accent') + ';margin-left:0"></span>ราคาสุดท้าย (มูลค่า Case)' +
        '<span class="legend-dot" style="background:' + cssVar('--good') + '"></span>ยอดที่ต่อรองลดได้' +
        '<span class="legend-dot" style="background:' + cssVar('--muted') + '"></span>ยังไม่มีราคาสุดท้าย (ใช้ราคาเสนอแรก / ประมาณการ)' +
        ' · ความยาวทั้งแท่ง = ราคาตั้งต้นก่อนต่อรอง · ตัวเลขท้ายแท่ง = ลดได้กี่ % และกี่บาท</div></div>' +
      '</div><p class="small muted">👆 คลิกที่แท่งเพื่อดูรายละเอียด Case และ Activity · ช่วงเวลานับตามวันที่สรุปผล (Activity CLOSED ล่าสุด) — ' +
      'Case ที่ยังไม่สรุปผลใช้วันที่ Activity ล่าสุด · ตัวเลขราคา AI ดึงจากข้อความ Activity ถ้าไม่ถูกให้แก้ข้อความใน DB หรือกด "ตรวจทั้ง Case ใหม่"</p>';
    $('tab-ranking').innerHTML = h;

    $('rankUnit').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      rankPeriod.unit = b.dataset.unit; renderRanking();
    });
    if (r) {
      $('rankPrev').addEventListener('click', function () { shiftPeriod(-1); renderRanking(); });
      $('rankNext').addEventListener('click', function () { shiftPeriod(1); renderRanking(); });
      $('rankToday').addEventListener('click', function () { rankPeriod.date = ''; renderRanking(); });
      $('rankDate').addEventListener('change', function () { if (this.value) { rankPeriod.date = this.value; renderRanking(); } });
    }

    $('rankSort').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      rankPeriod.sort = b.dataset.sort; renderRanking();
    });

    function caseLabel(c) { var t = c.ref || ''; return c.id.replace(/^[A-Z]+-\d{4}-/, '') + ' · ' + (t.length > 34 ? t.slice(0, 34) + '…' : t); }
    // แท่งเดียวต่อ Case: [ราคาสุดท้าย][ลดได้] → ความยาวรวม = ราคาตั้งต้น
    function finalOf(c) { return c.savings ? c.savings.final * c.savings.quantity : c.value.value; }
    function savingOf(c) { return c.savings ? c.savings.saving : 0; }
    var src = sortBy === 'saving' ? saved : valued;
    var top = src.slice().sort(function (a, b) {
      return sortBy === 'saving' ? savingOf(b) - savingOf(a) || finalOf(b) - finalOf(a) : finalOf(b) - finalOf(a);
    }).slice(0, 10);
    if (!top.length) {
      if (charts.chRank) { charts.chRank.destroy(); delete charts.chRank; }
      $('chRank').parentNode.innerHTML = '<div class="muted" style="padding:40px 0;text-align:center">ไม่มีข้อมูลราคาในช่วงนี้</div>';
      return;
    }
    var endLabel = { id: 'endLabel', afterDatasetsDraw: function (ch) {
      var ctx = ch.ctx, meta = ch.getDatasetMeta(1);
      ctx.save(); ctx.font = '500 12px ' + Chart.defaults.font.family; ctx.textBaseline = 'middle';
      top.forEach(function (c, i) {
        var el = meta.data[i]; if (!el) return;
        var txt, color;
        if (c.savings) { txt = '−' + fmt(c.savings.pct, 1) + '% · ลด ' + baht(c.savings.saving); color = cssVar('--good'); }
        else { txt = c.value.basis === 'final' ? 'ไม่มีราคาตั้งต้น' : 'ยังไม่มีราคาสุดท้าย'; color = cssVar('--muted'); }
        ctx.fillStyle = color; ctx.fillText(txt, el.x + 6, el.y);
      });
      ctx.restore();
    } };
    chart('chRank', pickable({ type: 'bar', data: { labels: top.map(caseLabel), datasets: [
        { label: 'ราคาสุดท้าย', data: top.map(finalOf), borderRadius: 4,
          backgroundColor: top.map(function (c) { return c.savings || c.value.basis === 'final' ? cssVar('--accent') : cssVar('--muted'); }) },
        { label: 'ลดได้', data: top.map(savingOf), backgroundColor: cssVar('--good'), borderRadius: 4 }
      ] },
      plugins: [endLabel],
      options: { indexAxis: 'y', maintainAspectRatio: false, layout: { padding: { right: 8 } },
        interaction: { mode: 'index', axis: 'y', intersect: true },
        plugins: { legend: { display: false },
          tooltip: { filter: function (it) { return it.datasetIndex === 0; }, callbacks: {
            title: function (it) { var c = top[it[0].dataIndex]; return c.id + ' · ' + (c.ref.length > 60 ? c.ref.slice(0, 60) + '…' : c.ref); },
            label: function (ctx) {
              var c = top[ctx.dataIndex], s = c.savings;
              var out = s ? ['ราคาตั้งต้น ' + baht(s.initial * s.quantity) + ' → ราคาสุดท้าย ' + baht(s.final * s.quantity),
                'ลดได้ ' + baht(s.saving) + ' (' + pctTxt(s.pct) + ')'] : ['มูลค่า ' + baht(c.value.value) + ' · ' + BASIS_LABEL[c.value.basis]];
              out.push(nameOf(c.buyer) + ' · ' + c.method + ' · ' + (c.closedDate ? 'สรุปผล ' : 'ล่าสุด ') + c.rankDate);
              return out;
            } } } },
        scales: { x: { stacked: true, beginAtZero: true, grace: '22%', ticks: { callback: function (v) { return fmt(v); } } },
          y: { stacked: true } } } },
    function (i) { openCase(top[i].id, r); }));
  }
  function round2(n) { return Math.round(n * 100) / 100; }

  // ---------------- buyers ----------------
  // ---------- ผลการต่อรองราคา ----------
  function pctTxt(v) { return v == null ? '–' : fmt(v, 2) + '%'; }
  function vsEstTxt(v) {
    if (v == null) return '<span class="muted">–</span>';
    return '<span style="color:var(--' + (v <= 0 ? 'good' : 'bad') + ')">' + (v > 0 ? '+' : '') + fmt(v, 2) + '%</span>';
  }
  function negoRow(name, n, closed, attrs, bold) {
    var b = bold ? ['<b>', '</b>'] : ['', ''];
    return '<tr' + (attrs || '') + '><td>' + b[0] + esc(name) + b[1] + '</td>' +
      '<td class="num">' + fmt(n.cases) + '<div class="small muted">สรุปผลแล้ว ' + fmt(closed) + '</div></td>' +
      '<td class="num">' + baht(n.initial) + '</td>' +
      '<td class="num">' + b[0] + baht(n.saving) + b[1] + '</td>' +
      '<td class="num">' + b[0] + pctTxt(n.pct) + b[1] + '</td>' +
      '<td class="num">' + pctTxt(n.avgPct) + '</td>' +

      '<td class="num">' + vsEstTxt(n.vsEstimatePct) + '</td>' +
      '<td class="num">' + (n.unmeasured ? '<span class="badge bad">' + fmt(n.unmeasured) + '</span>' : '0') +
        (n.notReviewed ? '<div class="small muted">รอ AI ' + fmt(n.notReviewed) + '</div>' : '') + '</td></tr>';
  }
  function negoSection() {
    var list = D.buyers.filter(function (b) { return b.nego && (b.nego.cases || b.closedCases || b.nego.unmeasured || b.nego.notReviewed); })
      .sort(function (a, b) { return b.nego.saving - a.nego.saving; });
    var h = '<h2>ผลการต่อรองราคารายคน</h2><div class="card table-wrap"><table><thead><tr>' +
      '<th>Buyer</th><th class="num" title="Case ที่ AI ดึงราคาก่อน/หลังต่อรองได้ (รวม Case ที่ยังต่อรองอยู่)">Case ที่มีตัวเลข</th><th class="num">ราคาตั้งต้นรวม</th>' +
      '<th class="num">ต่อรองได้ (บาท)</th><th class="num" title="ถ่วงน้ำหนักด้วยยอดเงิน">% ลดลง</th><th class="num">% เฉลี่ยต่อ Case</th>' +
      '<th class="num">ต่ำสุด–สูงสุด</th><th class="num" title="ราคาสุดท้ายเทียบราคาประมาณการ (ติดลบ = ต่ำกว่างบ)">เทียบราคาประมาณการ</th>' +
      '<th class="num" title="ต่อรอง/สรุปผลแล้ว แต่ไม่ระบุราคาเริ่มต้นหรือราคาสุดท้าย">วัดไม่ได้</th></tr></thead><tbody>' +
      (list.length ? list.map(function (b) {
        return negoRow(b.name, b.nego, b.closedCases, ' class="clickable" data-nego-buyer="' + esc(b.email) + '"');
      }).join('') : '<tr><td colspan="9" class="muted">ยังไม่มีตัวเลขการต่อรอง (รอ AI ตรวจ)</td></tr>') +
      (D.nego ? negoRow('รวมทั้งทีม', D.nego, D.nego.closedCases, ' style="background:var(--surface-2)"', true) : '') +
      '</tbody></table><p class="small muted">คลิกที่ชื่อเพื่อดูราย Case · % ลดลง = ยอดที่ต่อรองได้ ÷ ราคาตั้งต้นรวม (งานยอดใหญ่มีน้ำหนักมากกว่า) · ' +
      'ตัวเลขดึงจากข้อความด้วย AI นับเฉพาะ Case ที่มีทั้งราคาก่อนและหลังต่อรอง ถ้าตัวเลขไม่ถูก ให้กด "ตรวจทั้ง Case ใหม่" หรือแก้ข้อความใน DB</p></div>' +
      '<div class="grid cols-2" style="margin-top:12px"><div class="card"><h3>ต่อรองได้ (บาท) ตาม Buyer</h3><div class="chart-box"><canvas id="chNegoBuyer"></canvas></div></div>' +
      '<div class="card"><h3>% ที่ต่อรองลดลงได้ ตาม Buyer</h3><div class="chart-box"><canvas id="chNegoPctBuyer"></canvas></div>' +
      '<p class="small muted">% ถ่วงน้ำหนักด้วยยอดเงิน · แท่งสีเทา = ค่ารวมทั้งทีม</p></div></div>' +
      '<div id="negoDetail"></div>' + unmeasuredTable(null);
    return h;
  }
  /** Case ที่ต่อรอง/สรุปผลแล้วแต่วัดผลไม่ได้ (email = null → ทุกคน) */
  function unmeasuredTable(email) {
    var list = D.cases.filter(function (c) { return c.priceGap && (!email || c.buyer === email); })
      .sort(function (a, b) {
        var ra = a.priceGap.code === 'NOT_REVIEWED', rb = b.priceGap.code === 'NOT_REVIEWED';
        return (ra - rb) || (b.stage - a.stage) || String(a.id).localeCompare(String(b.id));

    if (!list.length) return '<h2>' + title + '</h2><div class="card muted">ไม่มี — ทุก Case ที่ต่อรอง/สรุปผลแล้วมีตัวเลขครบ</div>';

  function renderNegoChart(id, onPick) {

      .sort(function (a, b) { return b.nego.saving - a.nego.saving; });

  // ---------------- cases ----------------
  var FLAGS = { '': 'ทุกรายการ', stale: 'นิ่งเกินกำหนด', pastRequired: 'เลย Required Date', noActivity: 'ยังไม่มี Activity',
    closedButOpen: 'สรุปผลแล้วแต่ยัง OPEN', lowScore: 'คะแนน AI ต่ำ', fewQuotes: 'เทียบราคาน้อยกว่าเกณฑ์',
    noPrice: 'วัดผลต่อรองไม่ได้ (ขาดราคา)', readyToClose: 'AI: พร้อมปิด', inconsistent: 'AI: ข้อมูลขัดกัน', caseLow: 'AI: คะแนนทั้ง Case ต่ำ', casePending: 'AI: รอตรวจทั้ง Case' };
  function caseMatches(c) {
    var f = caseFilter;
    if (f.buyer && c.buyer !== f.buyer) return false;
    if (f.dept && c.dept !== f.dept) return false;
    if (f.method && c.method !== f.method) return false;
    if (f.status && c.status !== f.status) return false;
    if (f.flag === 'stale' && !c.stale) return false;
    if (f.flag === 'pastRequired' && !c.pastRequired) return false;
    if (f.flag === 'noActivity' && c.activityCount) return false;
    if (f.flag === 'closedButOpen' && !(c.hasClosedActivity && c.status === 'OPEN')) return false;
    if (f.flag === 'lowScore' && !(c.avgScore != null && c.avgScore < D.settings.SCORE_THRESHOLD)) return false;
    var cr = c.caseReview;
    if (f.flag === 'noPrice' && !(c.priceGap && c.priceGap.code !== 'NOT_REVIEWED')) return false;
    if (f.flag === 'readyToClose' && !(cr && cr.readyToClose)) return false;
    if (f.flag === 'inconsistent' && !(cr && cr.inconsistencies.length)) return false;
    if (f.flag === 'caseLow' && !(cr && cr.score < D.settings.SCORE_THRESHOLD)) return false;
    if (f.flag === 'casePending' && !(c.activityCount && c.caseReviewEligible && (!cr || cr.stale))) return false;
    if (f.flag === 'fewQuotes' && !(c.hasClosedActivity && c.method === 'NORMAL' && c.vendorsContacted < D.settings.MIN_QUOTES)) return false;
    if (f.q) {
      var s = (c.id + ' ' + c.ref + ' ' + c.requester + ' ' + c.subType).toLowerCase();
      if (s.indexOf(f.q.toLowerCase()) < 0) return false;
    }
    return true;
  }
  function opts(values, current, allLabel, labeler) {
    return '<option value="">' + allLabel + '</option>' + values.map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(labeler ? labeler(v) : v) + '</option>';
    }).join('');
  }
  function renderCases() {
    if (!D) return;
    var depts = Object.keys(D.cases.reduce(function (m, c) { m[c.dept] = 1; return m; }, {})).sort();
    var statuses = Object.keys(D.cases.reduce(function (m, c) { m[c.status] = 1; return m; }, {})).sort();
    var list = D.cases.filter(caseMatches);
    var h = '<div class="filters">' +
      '<input type="text" id="fQ" placeholder="ค้นหา Case / เรื่อง / ผู้ขอ" value="' + esc(caseFilter.q) + '">' +
      '<select id="fBuyer">' + opts(D.buyers.map(function (b) { return b.email; }), caseFilter.buyer, 'ทุก Buyer', nameOf) + '</select>' +
      '<select id="fDept">' + opts(depts, caseFilter.dept, 'ทุกแผนก', function (d) { return d + ' · ' + label('DEPARTMENT', d); }) + '</select>' +
      '<select id="fMethod">' + opts(['NORMAL', 'SPECIAL'], caseFilter.method, 'ทุก Method', function (m) { return m + ' · ' + label('METHOD', m); }) + '</select>' +
      '<select id="fStatus">' + opts(statuses, caseFilter.status, 'ทุกสถานะ') + '</select>' +
      '<select id="fFlag">' + Object.keys(FLAGS).map(function (k) { return '<option value="' + k + '"' + (k === caseFilter.flag ? ' selected' : '') + '>' + FLAGS[k] + '</option>'; }).join('') + '</select>' +
      '<span class="muted small">' + list.length + ' รายการ</span></div>';
    h += '<div class="card table-wrap"><table><thead><tr><th>Case</th><th>เรื่อง</th><th>แผนก</th><th>Buyer</th><th>ขั้นตอน</th>' +
      '<th class="num">อายุ (วัน)</th><th class="num">Activity</th><th class="num">ล่าสุด (วันก่อน)</th><th class="num">Vendor</th>' +
      '<th>คะแนน AI</th><th>AI ทั้ง Case</th><th class="num">Savings</th><th>สัญญาณ</th></tr></thead><tbody>' +
      list.map(function (c) {
        var flags = [];
        if (c.stale) flags.push('<span class="badge warn">นิ่ง</span>');
        if (c.pastRequired) flags.push('<span class="badge bad">เลยกำหนด</span>');
        if (!c.activityCount) flags.push('<span class="badge bad">ไม่มี Activity</span>');
        if (c.hasClosedActivity && c.status === 'OPEN') flags.push('<span class="badge info">รอปิด</span>');
        if (!c.intakeComplete) flags.push('<span class="badge">Intake ไม่ครบ</span>');
        if (c.priceGap && c.priceGap.code !== 'NOT_REVIEWED') flags.push('<span class="badge bad" title="' + esc(c.priceGap.label) + '">ขาดราคา</span>');
        return '<tr class="clickable" data-case="' + esc(c.id) + '"><td>' + esc(c.id) + '<div class="small muted">' + esc(c.method) + ' · ' + esc(c.budget) + '</div></td>' +
          '<td class="desc">' + esc(c.ref) + '<div class="small muted">' + esc(c.subType) + '</div></td><td>' + esc(c.dept) + '</td><td>' + esc(nameOf(c.buyer)) + '</td>' +
          '<td>' + esc(c.stageLabel) + '</td><td class="num">' + fmt(c.ageDays) + '</td><td class="num">' + fmt(c.activityCount) + '</td>' +
          '<td class="num">' + fmt(c.daysSinceLast) + '</td><td class="num">' + fmt(c.vendorsContacted) + '</td>' +
          '<td>' + (c.avgScore == null ? '<span class="badge">–</span>' : '<span class="badge ' + scoreClass(c.avgScore) + '">' + fmt(c.avgScore, 1) + '</span>') + '</td>' +
          '<td>' + caseBadge(c) + '</td>' +
          '<td class="num">' + (c.savings ? baht(c.savings.saving) + '<div class="small muted">' + fmt(c.savings.pct, 2) + '%</div>' : '–') + '</td>' +
          '<td>' + flags.join(' ') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    $('tab-cases').innerHTML = h;
    $('fQ').addEventListener('input', function (e) { caseFilter.q = e.target.value; clearTimeout(renderCases._t); renderCases._t = setTimeout(function () { renderCases(); var q = $('fQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); });
    [['fBuyer', 'buyer'], ['fDept', 'dept'], ['fMethod', 'method'], ['fStatus', 'status'], ['fFlag', 'flag']].forEach(function (p) {
      $(p[0]).addEventListener('change', function (e) { caseFilter[p[1]] = e.target.value; renderCases(); });
    });
  }

  function reviewBlock(a) {
    if (a.score === null || a.score === undefined) {

      (c.savings ? '<div>Savings</div><div>' + baht(c.savings.initial) + ' → ' + baht(c.savings.final) + (c.savings.quantity > 1 ? ' × ' + c.savings.quantity : '') +

      (c.priceGap ? '<div>Savings</div><div><span class="badge ' + (c.priceGap.code === 'NOT_REVIEWED' ? '' : 'bad') + '">วัดไม่ได้: ' + esc(c.priceGap.label) + '</span></div>' : '') +
      '<div>DB</div><div>' + sheetLink('Cases', c.row, 'เปิดแถวใน Sheet') + '</div></div>';
    h += caseReviewBlock(c);

  function caseBadge(c) {
    var cr = c.caseReview;
    if (!c.activityCount) return '<span class="badge">–</span>';
    if (!cr) return c.caseReviewEligible ? '<span class="badge">รอตรวจ</span>'
      : '<span class="badge" title="AI จะตรวจทั้ง Case เมื่อมี Activity ประเภท CLOSED (สรุปผล)">รอสรุปผล</span>';
    return gradeBadge(cr.score, cr.grade, cr.stale) +
      (cr.readyToClose && c.status === 'OPEN' ? ' <span class="badge good">พร้อมปิด</span>' : '') +
      (cr.inconsistencies.length ? ' <span class="badge bad" title="' + esc(cr.inconsistencies.join(' / ')) + '">ขัดกัน</span>' : '');
  }

  function caseReviewBlock(c) {
    if (!c.activityCount) return '';
    var cr = c.caseReview;
    var btn = '<button class="btn ghost" data-review-case="' + esc(c.id) + '" style="margin-left:auto">' +
      (cr ? 'ตรวจทั้ง Case ใหม่' : (c.caseReviewEligible ? 'ตรวจทั้ง Case ตอนนี้' : 'ตรวจตอนนี้ (ก่อนสรุปผล)')) + '</button>';
    var waitNote = c.caseReviewEligible ? '' :
      '<div class="small muted">AI จะตรวจทั้ง Case อัตโนมัติเมื่อมี Activity ประเภท CLOSED (สรุปผล) — ตอนนี้กดตรวจเองได้ถ้าต้องการดูสถานะกลางทาง</div>';
    if (!cr) return '<h2>AI สรุปทั้ง Case</h2><div class="review"><div class="tl-head"><span class="muted">' +
      (c.caseReviewEligible ? 'ยังไม่ได้ตรวจทั้ง Case' : 'ยังไม่ถึงขั้นสรุปผล') + '</span>' + btn + '</div>' + waitNote + '</div>';
    var riskCls = { low: 'good', medium: 'warn', high: 'bad' }[cr.risk] || '';
    var riskTh = { low: 'ต่ำ', medium: 'กลาง', high: 'สูง' }[cr.risk] || cr.risk;
    var h = '<h2>AI สรุปทั้ง Case</h2><div class="review"><div class="tl-head">' + gradeBadge(cr.score, cr.grade, cr.stale) +
      (cr.readyToClose ? '<span class="badge good">พร้อมปิด / ส่งอนุมัติ</span>' : '<span class="badge">ยังไม่พร้อมปิด</span>') +
      '<span class="badge ' + riskCls + '">ความเสี่ยง ' + esc(riskTh) + '</span>' +
      '<span class="small muted">' + esc(String(cr.reviewedAt).slice(0, 16).replace('T', ' ')) + ' · ' + fmt(cr.activityCount) + ' Activity</span>' + btn + '</div>' +
      (cr.stale ? '<div class="small" style="color:var(--warn)">* มี Activity ใหม่/ถูกแก้หลังจากตรวจ — รอตรวจใหม่</div>' : '') +
      (!c.caseReviewEligible ? '<div class="small muted">ผลนี้ตรวจก่อนสรุปผล (กดตรวจเอง) — จะตรวจใหม่อัตโนมัติเมื่อมี Activity CLOSED</div>' : '') +
      '<div style="margin:6px 0">' + esc(cr.summary) + '</div>' +
      '<ul class="crit">' + (cr.criteria || []).map(function (x) {
        var icon = x.result === 'yes' ? '✓' : x.result === 'partial' ? '◐' : '✗';
        return '<li><span class="' + esc(x.result) + '">' + icon + '</span> ' + esc(x.name) + (x.comment ? ' <span class="muted small">— ' + esc(x.comment) + '</span>' : '') + '</li>';
      }).join('') + '</ul>';
    if (cr.inconsistencies.length) h += '<div><b style="color:var(--bad)">ข้อมูลขัดกัน:</b><ul class="small">' + cr.inconsistencies.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    if (cr.missing.length) h += '<div><b>ยังขาด:</b><ul class="small">' + cr.missing.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    if (cr.nextStep) h += '<div><b>ขั้นตอนถัดไป:</b> ' + esc(cr.nextStep) + '</div>';

  function reviewCaseNow(caseId, btn) {
    btn.disabled = true; btn.textContent = 'กำลังตรวจทั้ง Case…';
    call('apiReviewCaseNow', [caseId]).then(function (json) {
      var r = JSON.parse(json);
      var c = D.cases.filter(function (x) { return x.id === caseId; })[0];
      if (c) {
        c.caseReview = { score: r.score, grade: r.grade, summary: r.summary, criteria: r.criteria, missing: r.missing_steps,
          inconsistencies: r.inconsistencies, readyToClose: r.ready_to_close, nextStep: r.next_step, risk: r.risk,
          stale: false, reviewedAt: r.reviewed_at, activityCount: r.activity_count };
      }
      toast(caseId + ' ได้ ' + r.grade + ' (' + r.score + ')' + (r.ready_to_close ? ' · พร้อมปิด' : ''));
      if (c && !$('drawer').classList.contains('hidden')) openCase(caseId);
      renderCases();
    }).catch(function (e) { toast('ตรวจไม่สำเร็จ: ' + e.message); btn.disabled = false; btn.textContent = 'ลองใหม่'; });
  }

  function reviewNow(actId, btn) {
    btn.disabled = true; btn.textContent = 'กำลังตรวจ…';
    call('apiReviewNow', [actId]).then(function (json) {
      var r = JSON.parse(json);
      var a = D.activities.filter(function (x) { return x.id === actId; })[0];
      if (a) {
        a.score = r.score; a.grade = r.grade; a.criteria = r.criteria; a.suggestion = r.suggestion; a.missing = r.missing;
        a.typeMismatch = r.type_mismatch; a.suggestedType = r.suggested_type; a.reviewStale = false; a.reviewedAt = r.reviewed_at;
        a.improvedExample = r.improved_example;
      }
      toast(actId + ' ได้ ' + r.grade + ' (' + r.score + ')');
      if (a && !$('drawer').classList.contains('hidden')) openCase(a.caseId);
    }).catch(function (e) { toast('ตรวจไม่สำเร็จ: ' + e.message); btn.disabled = false; btn.textContent = 'ลองใหม่'; });
  }

  // ---------------- AI ----------------
  function renderAi() {
    var ai = D.ai, th = D.settings.SCORE_THRESHOLD;

    var mism = reviewed.filter(function (a) { return a.typeMismatch; });

      kpi('คะแนนเฉลี่ย', ai.avgScore == null ? '–' : fmt(ai.avgScore, 1), 'เต็ม 100', scoreClass(ai.avgScore)) +
      kpi('ตรวจแล้ว', fmt(ai.reviewed), 'รอตรวจ ' + fmt(ai.pending) + ' รายการ') +
      kpi('ต่ำกว่าเกณฑ์ (' + th + ')', fmt(ai.lowCount), '', ai.lowCount ? 'bad' : 'good') +
      kpi('ประเภทไม่ตรงเนื้อหา', fmt(ai.typeMismatchCount), '', ai.typeMismatchCount ? 'warn' : 'good') +
      ['NORMAL', 'SPECIAL'].map(function (m) {
        var x = ai.byMethod && ai.byMethod[m];
        return kpi('คะแนน ' + m + ' · ' + label('METHOD', m), x ? fmt(x.avg, 1) : '–', x ? 'ตรวจแล้ว ' + fmt(x.count) + ' รายการ' : 'ยังไม่มีข้อมูล', x ? scoreClass(x.avg) : '');
      }).join('') +
      '</div>';
    var ac = ai.cases || {};

      kpi('คะแนนเฉลี่ยทั้ง Case', ac.avgScore == null ? '–' : fmt(ac.avgScore, 1), 'ตรวจแล้ว ' + fmt(ac.reviewed) + ' · รอตรวจ ' + fmt(ac.pending) + ' · ยังไม่สรุปผล ' + fmt(ac.waitingClose) + ' Case', scoreClass(ac.avgScore), 'cases:casePending:') +
      kpi('พร้อมปิด / ส่งอนุมัติ', fmt(ac.readyToClose), 'Case ที่ยัง OPEN', ac.readyToClose ? 'good' : '', 'cases:readyToClose:OPEN') +
      kpi('ข้อมูลขัดกัน', fmt(ac.withInconsistency), 'ตัวเลข/Vendor ไม่ตรงกันระหว่าง Activity', ac.withInconsistency ? 'bad' : 'good', 'cases:inconsistent:') +
      kpi('ความเสี่ยงสูง', fmt(ac.highRisk), 'Case ที่ยัง OPEN', ac.highRisk ? 'bad' : 'good') +
      '</div>';

      .sort(function (a, b) { return a.caseReview.score - b.caseReview.score; });

      lowCases.map(function (c) {
        return '<tr class="clickable" data-case="' + esc(c.id) + '"><td>' + esc(c.id) + '</td><td class="small">' + esc(c.ref) + '</td><td>' + esc(c.method) + '</td><td>' + esc(nameOf(c.buyer)) +
          '</td><td>' + caseBadge(c) + '</td><td class="small desc">' + esc(c.caseReview.summary) + '</td><td class="small">' + esc(c.caseReview.nextStep) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="card muted">ไม่มี</div>');
    h += '<div class="filters" style="margin-top:12px"><button class="btn" id="btnBatch">ตรวจรายการที่ค้างตอนนี้ (Activity ≤ ' + D.settings.BATCH_SIZE + ', Case ≤ ' + D.settings.CASE_BATCH_SIZE + ')</button>' +
      '<span class="small muted">Provider: <b>' + esc(D.settings.AI_PROVIDER) + '</b> · ' + esc(D.settings.AI_MODEL) + ' · ตรวจอัตโนมัติทุกชั่วโมง</span></div>';
    h += '<div class="grid cols-2"><div class="card"><h3>คะแนนเฉลี่ยตามประเภท Activity</h3><div class="chart-box"><canvas id="chType"></canvas></div></div>' +
      '<div class="card"><h3>เกณฑ์ที่ขาดบ่อยที่สุด</h3>' + topMissing(reviewed) + '</div></div>';
    h += '<h2>รายการที่ควรปรับปรุง (คะแนน &lt; ' + th + ')</h2>' + actTable(low, 'ไม่มีรายการต่ำกว่าเกณฑ์');

      (D.runs || []).map(function (r) {

      }).catch(function (err) { toast('ไม่สำเร็จ: ' + err.message); b.disabled = false; b.textContent = 'ลองใหม่'; });

  function topMissing(reviewed) {
    var count = {};
    reviewed.forEach(function (a) { (a.criteria || []).forEach(function (c) { if (c.result !== 'yes') count[c.name] = (count[c.name] || 0) + (c.result === 'no' ? 1 : 0.5); }); });
    var e = sortedEntries(count).slice(0, 8);
    if (!e.length) return '<div class="muted">ยังไม่มีข้อมูล</div>';
    var max = e[0][1];
    return '<table><tbody>' + e.map(function (x) {
      return '<tr><td>' + esc(x[0]) + '</td><td style="width:120px"><div class="bar"><span style="width:' + (x[1] / max * 100) + '%"></span></div></td><td class="num">' + fmt(x[1], 1) + '</td></tr>';
    }).join('') + '</tbody></table>';
  }

        Object.keys(D.criteria[m]).map(function (t) {
          var cr = D.criteria[m][t];
          return '<div class="card"><h3>' + esc(t) + '</h3><div class="small muted">ที่มา: ' + esc(cr.source) + '</div><ol class="small">' +
            cr.list.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ol></div>';
        }).join('') + '</div>';
    });
    $('tab-settings').innerHTML = h;
    $('btnSave').addEventListener('click', function (e) {
      var b = e.target; b.disabled = true;
      var payload = { AI_PROVIDER: $('sProvider').value, AI_MODEL: $('sModel').value.trim(), AI_EFFORT: $('sEffort').value };
      ['STALE_DAYS', 'SCORE_THRESHOLD', 'MIN_QUOTES', 'SHORT_DESC_CHARS', 'BATCH_SIZE', 'CASE_BATCH_SIZE'].forEach(function (k) { payload[k] = Number($('s_' + k).value); });
      call('apiSaveSettings', [payload]).then(function () { toast('บันทึกแล้ว'); load(true); })
        .catch(function (err) { toast('บันทึกไม่สำเร็จ: ' + err.message); }).then(function () { b.disabled = false; });
    });
  }
  function numRow(k, lbl) {
    return '<div class="form-row"><label for="s_' + k + '">' + esc(lbl) + '</label><input type="number" min="0" id="s_' + k + '" value="' + esc(D.settings[k]) + '"></div>';
  }

  // ---------------- load ----------------
  function renderAll() {
    $('subtitle').textContent = 'ข้อมูล ณ ' + new Date(D.generatedAt).toLocaleString('th-TH') + ' · อ่านจาก "' + D.meta.name + '" (อ่านอย่างเดียว)';
    renderOverview(); renderBuyers(); renderRanking(); renderCases(); renderAi(); renderHealth(); renderSettings();
  }
  function load(refresh) {
    $('loading').classList.remove('hidden'); $('error').classList.add('hidden');
    $('btnRefresh').disabled = true;
    call(refresh ? 'apiRefresh' : 'apiGetDashboard').then(function (json) {
      D = JSON.parse(json);
      renderAll();
    }).catch(function (e) {
      $('error').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; $('error').classList.remove('hidden');
    }).then(function () { $('loading').classList.add('hidden'); $('btnRefresh').disabled = false; });
  }
  $('btnRefresh').addEventListener('click', function () { load(true); });
  try { var t = localStorage.getItem('dash.tab'); if (t && $('tab-' + t)) showTab(t); } catch (e) {}
  load(false);
})();
</script>
