<script>
(function () {
  'use strict';
  var D = null;               // dashboard payload
  var charts = {};
  var caseFilter = { buyer: '', dept: '', method: '', status: 'OPEN', flag: '', q: '' };

  // ---------------- helpers ----------------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n, d) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '–';
    return Number(n).toLocaleString('th-TH', { maximumFractionDigits: d === undefined ? 0 : d });
  }
  function baht(n) { return n == null ? '–' : '฿' + fmt(n); }
  function nameOf(email) {
    var b = (D.buyers || []).filter(function (x) { return x.email === email; })[0];
    return b ? b.name : (email ? String(email).split('@')[0] : '–');
  }
  function label(list, code) {
    var l = D.lists && D.lists[list];
    return l && l[code] ? l[code] : code;
  }
  function gradeBadge(score, grade, stale) {
    if (score === null || score === undefined) return '<span class="badge">ยังไม่ตรวจ</span>';
    return '<span class="badge grade-' + esc(grade) + '" title="' + (stale ? 'เนื้อหา/เกณฑ์เปลี่ยน รอตรวจใหม่' : '') + '">' +
      esc(grade) + ' · ' + fmt(score) + (stale ? ' *' : '') + '</span>';
  }
  function scoreClass(s) {
    if (s == null) return '';
    return s >= 70 ? 'good' : s >= D.settings.SCORE_THRESHOLD ? 'warn' : 'bad';
  }
  function sheetLink(sheet, row, text) {
    var gid = D.meta.gids[sheet];
    var url = D.meta.url + '#gid=' + gid + (row ? '&range=A' + row : '');
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text || ('แถว ' + row)) + '</a>';
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add('hidden'); }, 3500);
  }
  function call(fn, args) {
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args || []);
    });
  }
  function kpi(lbl, value, hint, cls, onClickTab) {
    return '<div class="card kpi ' + (cls || '') + (onClickTab ? ' clickable" data-goto="' + onClickTab : '') + '">' +
      '<div class="label">' + esc(lbl) + '</div><div class="value">' + value + '</div>' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function chart(id, cfg) {
    if (charts[id]) charts[id].destroy();
    var el = $(id); if (!el || !window.Chart) return;
    Chart.defaults.color = cssVar('--muted');
    Chart.defaults.borderColor = cssVar('--border');
    Chart.defaults.font.family = "'IBM Plex Sans Thai', system-ui, sans-serif";
    charts[id] = new Chart(el, cfg);
  }
  function sortedEntries(obj) {
    return Object.keys(obj || {}).map(function (k) { return [k, obj[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }
  function hbar(id, obj, labeler) {
    var e = sortedEntries(obj);
    chart(id, { type: 'bar', data: { labels: e.map(function (x) { return labeler ? labeler(x[0]) : x[0]; }),
      datasets: [{ data: e.map(function (x) { return x[1]; }), backgroundColor: cssVar('--accent'), borderRadius: 4 }] },
      options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { ticks: { precision: 0 } } } } });
  }

  // ---------------- tabs ----------------
  function showTab(name) {
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
    document.querySelectorAll('.tab').forEach(function (s) { s.classList.toggle('hidden', s.id !== 'tab-' + name); });
    try { localStorage.setItem('dash.tab', name); } catch (e) {}
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) showTab(b.dataset.tab);
  });
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-goto]');
    if (g) {
      var parts = g.dataset.goto.split(':');
      if (parts[1] !== undefined) { caseFilter.flag = parts[1]; caseFilter.status = parts[2] !== undefined ? parts[2] : 'OPEN'; renderCases(); }
      showTab(parts[0]);
    }
    var c = e.target.closest('[data-case]');
    if (c) { if (c.tagName === 'A') e.preventDefault(); openCase(c.dataset.case); }
    var rv = e.target.closest('[data-review]');
    if (rv) reviewNow(rv.dataset.review, rv);
    var rc = e.target.closest('[data-review-case]');
    if (rc) reviewCaseNow(rc.dataset.reviewCase, rc);
  });

  // ---------------- overview ----------------
  function renderOverview() {
    var o = D.overview, ai = D.ai;
    var h = '<div class="grid kpis">' +
      kpi('Case เปิดอยู่', fmt(o.openCases), 'ทั้งหมด ' + fmt(o.totalCases) + ' · ใหม่ 7 วัน ' + fmt(o.newCases7d), '', 'cases::OPEN') +
      kpi('Next action เลยกำหนด', fmt(o.overdueNextActions), 'ลืมติ๊ก Done ' + fmt(o.forgotDone) + ' · ครบกำหนดวันนี้/พรุ่งนี้ ' + fmt(o.dueSoon), o.overdueNextActions ? 'bad' : 'good') +
      kpi('Case นิ่ง > ' + D.settings.STALE_DAYS + ' วัน', fmt(o.staleCases), 'ไม่มี Activity เลย ' + fmt(o.noActivityCases), o.staleCases ? 'warn' : 'good', 'cases:stale:OPEN') +
      kpi('สรุปผลแล้วแต่ยัง OPEN', fmt(o.closedButOpen), 'รอปิด Case / ออก PR', o.closedButOpen ? 'warn' : '', 'cases:closedButOpen:OPEN') +
      kpi('เลย Required Date', fmt(o.pastRequired), 'อายุ Case เฉลี่ย ' + fmt(o.avgCaseAge, 1) + ' วัน', o.pastRequired ? 'bad' : '', 'cases:pastRequired:OPEN') +
      kpi('คะแนนการเขียน (AI)', o.avgScore == null ? '–' : fmt(o.avgScore, 1), 'ตรวจแล้ว ' + fmt(ai.reviewed) + ' · รอ ' + fmt(ai.pending), scoreClass(o.avgScore), 'ai') +
      kpi('Savings ที่ต่อรองได้', baht(o.savingsTotal), o.savingsPct == null ? 'ยังไม่มีข้อมูลราคา' : fmt(o.savingsPct, 2) + '% จาก ' + fmt(o.savingsCases) + ' Case', 'good') +
      kpi('รับงานถึง Activity แรก', o.avgFirstResponseDays == null ? '–' : fmt(o.avgFirstResponseDays, 1) + ' วัน', 'ค่าเฉลี่ยทุก Case') +
      '</div>';

    h += '<div class="grid cols-2" style="margin-top:12px">' +
      '<div class="card"><h3>Case เปิดอยู่ตาม Buyer</h3><div class="chart-box"><canvas id="chBuyer"></canvas></div></div>' +
      '<div class="card"><h3>แนวโน้มรายสัปดาห์</h3><div class="chart-box"><canvas id="chWeekly"></canvas></div></div>' +
      '<div class="card"><h3>Case เปิดอยู่ตามแผนก</h3><div class="chart-box"><canvas id="chDept"></canvas></div></div>' +
      '<div class="card"><h3>ขั้นตอนของ Case ที่เปิดอยู่</h3><div class="chart-box"><canvas id="chFunnel"></canvas></div></div>' +
      '<div class="card"><h3>Budget Type</h3><div class="chart-box"><canvas id="chBudget"></canvas></div></div>' +
      '<div class="card"><h3>ช่องทางที่ใช้ติดต่อ</h3><div class="chart-box"><canvas id="chChannel"></canvas></div></div>' +
      '<div class="card clickable" data-goto="buyers"><h3>ต่อรองได้ (บาท) ตาม Buyer</h3><div class="chart-box"><canvas id="chNegoOverview"></canvas></div></div>' +
      '<div class="card clickable" data-goto="buyers"><h3>% ที่ต่อรองลดลงได้ ตาม Buyer</h3><div class="chart-box"><canvas id="chNegoPctOverview"></canvas></div></div>' +
      '</div>';

    h += '<h2>Next action ที่เลยกำหนด</h2>' + nextActionTable(D.nextActions.overdue, 'ไม่มีรายการเลยกำหนด 🎉');
    h += '<h2>ครบกำหนดวันนี้ / พรุ่งนี้</h2>' + nextActionTable(D.nextActions.dueSoon, 'ไม่มี');
    $('tab-overview').innerHTML = h;

    hbar('chBuyer', D.breakdown.byBuyer, nameOf);
    hbar('chDept', D.breakdown.byDept, function (c) { return c + ' · ' + label('DEPARTMENT', c); });
    hbar('chChannel', D.breakdown.byChannel);
    renderNegoChart('chNegoOverview');
    renderNegoPctChart('chNegoPctOverview');
    var be = sortedEntries(D.breakdown.byBudget);
    var palette = [cssVar('--accent'), cssVar('--good'), cssVar('--warn'), cssVar('--bad'), cssVar('--muted')];
    chart('chBudget', { type: 'doughnut', data: { labels: be.map(function (x) { return x[0]; }),
      datasets: [{ data: be.map(function (x) { return x[1]; }), backgroundColor: palette, borderColor: cssVar('--surface') }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' } } } });
    chart('chFunnel', { type: 'bar', data: { labels: D.funnel.map(function (f) { return f.label; }),
      datasets: [{ data: D.funnel.map(function (f) { return f.count; }), backgroundColor: cssVar('--accent'), borderRadius: 4 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { precision: 0 } } } } });
    chart('chWeekly', { type: 'bar', data: { labels: D.weekly.map(function (w) { return w.week; }), datasets: [
      { label: 'Activity', data: D.weekly.map(function (w) { return w.activities; }), backgroundColor: cssVar('--accent'), borderRadius: 4, yAxisID: 'y' },
      { label: 'Case ใหม่', data: D.weekly.map(function (w) { return w.newCases; }), backgroundColor: cssVar('--muted'), borderRadius: 4, yAxisID: 'y' },
      { label: 'คะแนน AI', type: 'line', data: D.weekly.map(function (w) { return w.avgScore; }), borderColor: cssVar('--good'), backgroundColor: cssVar('--good'), yAxisID: 'y2', spanGaps: true }
    ] }, options: { maintainAspectRatio: false, scales: { y: { ticks: { precision: 0 } }, y2: { position: 'right', min: 0, max: 100, grid: { display: false } } } } });
  }

  function nextActionTable(list, empty) {
    if (!list.length) return '<div class="card muted">' + empty + '</div>';
    return '<div class="card table-wrap"><table><thead><tr><th>Case</th><th>Activity</th><th>Next action</th><th>กำหนด</th><th class="num">เลย (วัน)</th><th>Buyer</th></tr></thead><tbody>' +
      list.map(function (o) {
        return '<tr class="clickable" data-case="' + esc(o.caseId) + '"><td>' + esc(o.caseId) + '</td><td>' + esc(o.id) + '</td><td>' + esc(o.nextAction) +
          '</td><td>' + esc(o.nextDate) + '</td><td class="num">' + (o.daysLate > 0 ? fmt(o.daysLate) : '–') + '</td><td>' + esc(nameOf(o.by)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ---------------- buyers ----------------
  // ---------- ผลการต่อรองราคา ----------
  function pctTxt(v) { return v == null ? '–' : fmt(v, 2) + '%'; }
  function vsEstTxt(v) {
    if (v == null) return '<span class="muted">–</span>';
    return '<span style="color:var(--' + (v <= 0 ? 'good' : 'bad') + ')">' + (v > 0 ? '+' : '') + fmt(v, 2) + '%</span>';
  }
  function negoRow(name, n, closed, attrs, bold) {
    var b = bold ? ['<b>', '</b>'] : ['', ''];
    return '<tr' + (attrs || '') + '><td>' + b[0] + esc(name) + b[1] + '</td>' +
      '<td class="num">' + fmt(n.cases) + '<div class="small muted">สรุปผลแล้ว ' + fmt(closed) + '</div></td>' +
      '<td class="num">' + baht(n.initial) + '</td>' +
      '<td class="num">' + b[0] + baht(n.saving) + b[1] + '</td>' +
      '<td class="num">' + b[0] + pctTxt(n.pct) + b[1] + '</td>' +
      '<td class="num">' + pctTxt(n.avgPct) + '</td>' +
      '<td class="num">' + (n.cases ? pctTxt(n.minPct) + ' – ' + pctTxt(n.maxPct) : '–') + '</td>' +
      '<td class="num">' + vsEstTxt(n.vsEstimatePct) + '</td>' +
      '<td class="num">' + (n.unmeasured ? '<span class="badge bad">' + fmt(n.unmeasured) + '</span>' : '0') +
        (n.notReviewed ? '<div class="small muted">รอ AI ' + fmt(n.notReviewed) + '</div>' : '') + '</td></tr>';
  }
  function negoSection() {
    var list = D.buyers.filter(function (b) { return b.nego && (b.nego.cases || b.closedCases || b.nego.unmeasured || b.nego.notReviewed); })
      .sort(function (a, b) { return b.nego.saving - a.nego.saving; });
    var h = '<h2>ผลการต่อรองราคารายคน</h2><div class="grid cols-2"><div class="card table-wrap"><table><thead><tr>' +
      '<th>Buyer</th><th class="num" title="Case ที่ AI ดึงราคาก่อน/หลังต่อรองได้ (รวม Case ที่ยังต่อรองอยู่)">Case ที่มีตัวเลข</th><th class="num">ราคาตั้งต้นรวม</th>' +
      '<th class="num">ต่อรองได้ (บาท)</th><th class="num" title="ถ่วงน้ำหนักด้วยยอดเงิน">% ลดลง</th><th class="num">% เฉลี่ยต่อ Case</th>' +
      '<th class="num">ต่ำสุด–สูงสุด</th><th class="num" title="ราคาสุดท้ายเทียบราคาประมาณการ (ติดลบ = ต่ำกว่างบ)">เทียบราคาประมาณการ</th>' +
      '<th class="num" title="ต่อรอง/สรุปผลแล้ว แต่ไม่ระบุราคาเริ่มต้นหรือราคาสุดท้าย">วัดไม่ได้</th></tr></thead><tbody>' +
      (list.length ? list.map(function (b) {
        return negoRow(b.name, b.nego, b.closedCases, ' class="clickable" data-nego-buyer="' + esc(b.email) + '"');
      }).join('') : '<tr><td colspan="9" class="muted">ยังไม่มีตัวเลขการต่อรอง (รอ AI ตรวจ)</td></tr>') +
      (D.nego ? negoRow('รวมทั้งทีม', D.nego, D.nego.closedCases, ' style="background:var(--surface-2)"', true) : '') +
      '</tbody></table><p class="small muted">คลิกที่ชื่อเพื่อดูราย Case · % ลดลง = ยอดที่ต่อรองได้ ÷ ราคาตั้งต้นรวม (งานยอดใหญ่มีน้ำหนักมากกว่า) · ' +
      'ตัวเลขดึงจากข้อความด้วย AI นับเฉพาะ Case ที่มีทั้งราคาก่อนและหลังต่อรอง ถ้าตัวเลขไม่ถูก ให้กด "ตรวจทั้ง Case ใหม่" หรือแก้ข้อความใน DB</p></div>' +
      '<div class="card"><h3>ต่อรองได้ (บาท) ตาม Buyer</h3><div class="chart-box"><canvas id="chNegoBuyer"></canvas></div></div>' +
      '<div class="card"><h3>% ที่ต่อรองลดลงได้ ตาม Buyer</h3><div class="chart-box"><canvas id="chNegoPctBuyer"></canvas></div>' +
      '<p class="small muted">% ถ่วงน้ำหนักด้วยยอดเงิน · แท่งสีเทา = ค่ารวมทั้งทีม</p></div></div>' +
      '<div id="negoDetail"></div>' + unmeasuredTable(null);
    return h;
  }
  /** Case ที่ต่อรอง/สรุปผลแล้วแต่วัดผลไม่ได้ (email = null → ทุกคน) */
  function unmeasuredTable(email) {
    var list = D.cases.filter(function (c) { return c.priceGap && (!email || c.buyer === email); })
      .sort(function (a, b) {
        var ra = a.priceGap.code === 'NOT_REVIEWED', rb = b.priceGap.code === 'NOT_REVIEWED';
        return (ra - rb) || (b.stage - a.stage) || String(a.id).localeCompare(String(b.id));
      });
    var title = email ? 'Case ที่วัดผลการต่อรองไม่ได้' : 'Case ที่วัดผลการต่อรองไม่ได้ (ขาดราคาเริ่มต้น / ราคาสุดท้าย)';
    if (!list.length) return '<h2>' + title + '</h2><div class="card muted">ไม่มี — ทุก Case ที่ต่อรอง/สรุปผลแล้วมีตัวเลขครบ</div>';
    return '<h2>' + title + ' <span class="muted">(' + list.length + ')</span></h2><div class="card table-wrap"><table><thead><tr>' +
      '<th>Case</th><th>เรื่อง</th>' + (email ? '' : '<th>Buyer</th>') + '<th>ขั้นตอน</th><th>สาเหตุ</th><th>แก้ไข</th></tr></thead><tbody>' +
      list.map(function (c) {
        var g = c.priceGap, cls = g.code === 'NOT_REVIEWED' ? '' : (c.stage === 3 ? 'bad' : 'warn');
        return '<tr class="clickable" data-case="' + esc(c.id) + '"><td>' + esc(c.id) + '</td><td class="small">' + esc(c.ref) + '</td>' +
          (email ? '' : '<td>' + esc(nameOf(c.buyer)) + '</td>') + '<td>' + esc(c.stageLabel) + '</td>' +
          '<td><span class="badge ' + cls + '">' + esc(g.label) + '</span></td>' +
          '<td class="small muted">' + (g.code === 'NOT_REVIEWED' ? 'รอรอบตรวจ หรือกด "ตรวจทั้ง Case"' :
            g.code === 'SPLIT' ? 'กด "ตรวจทั้ง Case" ในหน้า Case' : 'ให้ Buyer เพิ่มราคาใน Activity (NEGOTIATION/CLOSED)') + '</td></tr>';
      }).join('') + '</tbody></table><p class="small muted">นับเฉพาะ Case ที่ถึงขั้นเจรจาต่อรองหรือสรุปผลแล้ว · ' +
      'สีแดง = สรุปผลแล้ว (ควรมีราคาครบ), สีเหลือง = กำลังต่อรอง</p></div>';
  }
  function negoCaseTable(email) {
    var b = D.buyers.filter(function (x) { return x.email === email; })[0];
    var list = D.cases.filter(function (c) { return c.buyer === email && c.savings; })
      .sort(function (a, b) { return b.savings.saving - a.savings.saving; });
    var h = '<h2>รายการต่อรองของ ' + esc(b ? b.name : email) + '</h2><div class="card table-wrap"><table><thead><tr>' +
      '<th>Case</th><th>เรื่อง</th><th>Vendor</th><th class="num">ราคาตั้งต้น</th><th class="num">ราคาสุดท้าย</th>' +
      '<th class="num">ลดได้ (บาท)</th><th class="num">% ลดลง</th><th class="num">เทียบประมาณการ</th><th>ที่มา</th></tr></thead><tbody>' +
      (list.length ? list.map(function (c) {
        var s = c.savings;
        return '<tr class="clickable" data-case="' + esc(c.id) + '"><td>' + esc(c.id) + '</td><td class="small">' + esc(c.ref) + '</td>' +
          '<td class="small">' + esc(s.vendor || '–') + '</td>' +
          '<td class="num">' + baht(s.initial) + (s.quantity > 1 ? '<div class="small muted">× ' + fmt(s.quantity) + '</div>' : '') + '</td>' +
          '<td class="num">' + baht(s.final) + '</td><td class="num"><b>' + baht(s.saving) + '</b></td><td class="num">' + pctTxt(s.pct) + '</td>' +
          '<td class="num">' + vsEstTxt(s.vsEstimatePct) + '</td>' +
          '<td class="small muted">' + (s.source === 'case' ? 'AI ทั้ง Case' : 'AI ราย Activity') + '</td></tr>';
      }).join('') : '<tr><td colspan="9" class="muted">ยังไม่มีตัวเลข</td></tr>') + '</tbody></table>' +
      '</div>' + unmeasuredTable(email);
    return h;
  }
  function renderNegoChart(id) {
    var list = D.buyers.filter(function (b) { return b.nego && b.nego.cases; })
      .sort(function (a, b) { return b.nego.saving - a.nego.saving; });
    chart(id, { type: 'bar', data: { labels: list.map(function (b) { return b.name; }),
      datasets: [{ data: list.map(function (b) { return b.nego.saving; }), backgroundColor: cssVar('--good'), borderRadius: 4 }] },
      options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: function (ctx) { var n = list[ctx.dataIndex].nego;
          return baht(n.saving) + ' · ลด ' + pctTxt(n.pct) + ' · ' + n.cases + ' Case'; } } } },
        scales: { x: { ticks: { callback: function (v) { return fmt(v); } } } } } });
  }

  function renderNegoPctChart(id) {
    var list = D.buyers.filter(function (b) { return b.nego && b.nego.cases && b.nego.pct != null; })
      .sort(function (a, b) { return b.nego.pct - a.nego.pct; });
    var rows = list.map(function (b) { return { name: b.name, n: b.nego, team: false }; });
    if (D.nego && D.nego.pct != null) rows.push({ name: 'รวมทั้งทีม', n: D.nego, team: true });
    chart(id, { type: 'bar', data: { labels: rows.map(function (r) { return r.name; }),
      datasets: [{ data: rows.map(function (r) { return r.n.pct; }),
        backgroundColor: rows.map(function (r) { return r.team ? cssVar('--muted') : cssVar('--accent'); }), borderRadius: 4 }] },
      options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: function (ctx) { var n = rows[ctx.dataIndex].n;

  // ---------------- cases ----------------
  var FLAGS = { '': 'ทุกรายการ', stale: 'นิ่งเกินกำหนด', pastRequired: 'เลย Required Date', noActivity: 'ยังไม่มี Activity',
    closedButOpen: 'สรุปผลแล้วแต่ยัง OPEN', lowScore: 'คะแนน AI ต่ำ', fewQuotes: 'เทียบราคาน้อยกว่าเกณฑ์',
    noPrice: 'วัดผลต่อรองไม่ได้ (ขาดราคา)', readyToClose: 'AI: พร้อมปิด', inconsistent: 'AI: ข้อมูลขัดกัน', caseLow: 'AI: คะแนนทั้ง Case ต่ำ', casePending: 'AI: รอตรวจทั้ง Case' };
  function caseMatches(c) {
    var f = caseFilter;
    if (f.buyer && c.buyer !== f.buyer) return false;
    if (f.dept && c.dept !== f.dept) return false;
    if (f.method && c.method !== f.method) return false;
    if (f.status && c.status !== f.status) return false;
    if (f.flag === 'stale' && !c.stale) return false;
    if (f.flag === 'pastRequired' && !c.pastRequired) return false;
    if (f.flag === 'noActivity' && c.activityCount) return false;
    if (f.flag === 'closedButOpen' && !(c.hasClosedActivity && c.status === 'OPEN')) return false;
    if (f.flag === 'lowScore' && !(c.avgScore != null && c.avgScore < D.settings.SCORE_THRESHOLD)) return false;
    var cr = c.caseReview;
    if (f.flag === 'noPrice' && !(c.priceGap && c.priceGap.code !== 'NOT_REVIEWED')) return false;
    if (f.flag === 'readyToClose' && !(cr && cr.readyToClose)) return false;
    if (f.flag === 'inconsistent' && !(cr && cr.inconsistencies.length)) return false;
    if (f.flag === 'caseLow' && !(cr && cr.score < D.settings.SCORE_THRESHOLD)) return false;
    if (f.flag === 'casePending' && !(c.activityCount && (!cr || cr.stale))) return false;
    if (f.flag === 'fewQuotes' && !(c.hasClosedActivity && c.method === 'NORMAL' && c.vendorsContacted < D.settings.MIN_QUOTES)) return false;
    if (f.q) {
      var s = (c.id + ' ' + c.ref + ' ' + c.requester + ' ' + c.subType).toLowerCase();
      if (s.indexOf(f.q.toLowerCase()) < 0) return false;
    }
    return true;
  }
  function opts(values, current, allLabel, labeler) {

    }).join('');
  }

  function caseBadge(c) {

  function reviewCaseNow(caseId, btn) {

      var r = JSON.parse(json);
      var c = D.cases.filter(function (x) { return x.id === caseId; })[0];
      if (c) {
        c.caseReview = { score: r.score, grade: r.grade, summary: r.summary, criteria: r.criteria, missing: r.missing_steps,
          inconsistencies: r.inconsistencies, readyToClose: r.ready_to_close, nextStep: r.next_step, risk: r.risk,
          stale: false, reviewedAt: r.reviewed_at, activityCount: r.activity_count };
      }
      toast(caseId + ' ได้ ' + r.grade + ' (' + r.score + ')' + (r.ready_to_close ? ' · พร้อมปิด' : ''));
      if (c && !$('drawer').classList.contains('hidden')) openCase(caseId);
      renderCases();
    }).catch(function (e) { toast('ตรวจไม่สำเร็จ: ' + e.message); btn.disabled = false; btn.textContent = 'ลองใหม่'; });
  }

  function reviewNow(actId, btn) {
    btn.disabled = true; btn.textContent = 'กำลังตรวจ…';
    call('apiReviewNow', [actId]).then(function (json) {
      var r = JSON.parse(json);
      var a = D.activities.filter(function (x) { return x.id === actId; })[0];
      if (a) {
        a.score = r.score; a.grade = r.grade; a.criteria = r.criteria; a.suggestion = r.suggestion; a.missing = r.missing;
        a.typeMismatch = r.type_mismatch; a.suggestedType = r.suggested_type; a.reviewStale = false; a.reviewedAt = r.reviewed_at;
        a.improvedExample = r.improved_example;

  }

  function renderAi() {

    var low = reviewed.filter(function (a) { return a.score < th; }).sort(function (a, b) { return a.score - b.score; });
    var mism = reviewed.filter(function (a) { return a.typeMismatch; });
    var h = '<div class="grid kpis">' +
      kpi('คะแนนเฉลี่ย', ai.avgScore == null ? '–' : fmt(ai.avgScore, 1), 'เต็ม 100', scoreClass(ai.avgScore)) +
      kpi('ตรวจแล้ว', fmt(ai.reviewed), 'รอตรวจ ' + fmt(ai.pending) + ' รายการ') +
      kpi('ต่ำกว่าเกณฑ์ (' + th + ')', fmt(ai.lowCount), '', ai.lowCount ? 'bad' : 'good') +
      kpi('ประเภทไม่ตรงเนื้อหา', fmt(ai.typeMismatchCount), '', ai.typeMismatchCount ? 'warn' : 'good') +
      ['NORMAL', 'SPECIAL'].map(function (m) {
        var x = ai.byMethod && ai.byMethod[m];
        return kpi('คะแนน ' + m + ' · ' + label('METHOD', m), x ? fmt(x.avg, 1) : '–', x ? 'ตรวจแล้ว ' + fmt(x.count) + ' รายการ' : 'ยังไม่มีข้อมูล', x ? scoreClass(x.avg) : '');
      }).join('') +
      '</div>';
    var ac = ai.cases || {};
    h += '<h2>AI ตรวจทั้ง Case</h2><div class="grid kpis">' +
      kpi('คะแนนเฉลี่ยทั้ง Case', ac.avgScore == null ? '–' : fmt(ac.avgScore, 1), 'ตรวจแล้ว ' + fmt(ac.reviewed) + ' · รอตรวจ ' + fmt(ac.pending) + ' Case', scoreClass(ac.avgScore), 'cases:casePending:') +
      kpi('พร้อมปิด / ส่งอนุมัติ', fmt(ac.readyToClose), 'Case ที่ยัง OPEN', ac.readyToClose ? 'good' : '', 'cases:readyToClose:OPEN') +
      kpi('ข้อมูลขัดกัน', fmt(ac.withInconsistency), 'ตัวเลข/Vendor ไม่ตรงกันระหว่าง Activity', ac.withInconsistency ? 'bad' : 'good', 'cases:inconsistent:') +
      kpi('ความเสี่ยงสูง', fmt(ac.highRisk), 'Case ที่ยัง OPEN', ac.highRisk ? 'bad' : 'good') +
      '</div>';
    var lowCases = D.cases.filter(function (c) { return c.caseReview && c.caseReview.score < th; })
      .sort(function (a, b) { return a.caseReview.score - b.caseReview.score; });
    h += '<h2>Case ที่คะแนนทั้ง Case ต่ำกว่าเกณฑ์</h2>' + (lowCases.length ? '<div class="card table-wrap"><table><thead><tr><th>Case</th><th>เรื่อง</th><th>Method</th><th>Buyer</th><th>AI ทั้ง Case</th><th>สรุป</th><th>ขั้นตอนถัดไป</th></tr></thead><tbody>' +
      lowCases.map(function (c) {
        return '<tr class="clickable" data-case="' + esc(c.id) + '"><td>' + esc(c.id) + '</td><td class="small">' + esc(c.ref) + '</td><td>' + esc(c.method) + '</td><td>' + esc(nameOf(c.buyer)) +
          '</td><td>' + caseBadge(c) + '</td><td class="small desc">' + esc(c.caseReview.summary) + '</td><td class="small">' + esc(c.caseReview.nextStep) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="card muted">ไม่มี</div>');
    h += '<div class="filters" style="margin-top:12px"><button class="btn" id="btnBatch">ตรวจรายการที่ค้างตอนนี้ (Activity ≤ ' + D.settings.BATCH_SIZE + ', Case ≤ ' + D.settings.CASE_BATCH_SIZE + ')</button>' +
      '<span class="small muted">Provider: <b>' + esc(D.settings.AI_PROVIDER) + '</b> · ' + esc(D.settings.AI_MODEL) + ' · ตรวจอัตโนมัติทุกชั่วโมง</span></div>';
    h += '<div class="grid cols-2"><div class="card"><h3>คะแนนเฉลี่ยตามประเภท Activity</h3><div class="chart-box"><canvas id="chType"></canvas></div></div>' +
      '<div class="card"><h3>เกณฑ์ที่ขาดบ่อยที่สุด</h3>' + topMissing(reviewed) + '</div></div>';
    h += '<h2>รายการที่ควรปรับปรุง (คะแนน &lt; ' + th + ')</h2>' + actTable(low, 'ไม่มีรายการต่ำกว่าเกณฑ์');
    h += '<h2>ประเภท Activity ไม่ตรงกับเนื้อหา</h2>' + actTable(mism, 'ไม่มี');
    h += '<h2>ประวัติการรัน</h2><div class="card table-wrap"><table><thead><tr><th>เริ่ม</th><th>Provider</th><th class="num">Activity ค้าง/ตรวจ</th><th class="num">Case ค้าง/ตรวจ</th><th class="num">Error</th><th>ข้อความ</th></tr></thead><tbody>' +
      (D.runs || []).map(function (r) {
        return '<tr><td>' + esc(String(r.started).slice(0, 19).replace('T', ' ')) + '</td><td>' + esc(r.provider) + ' · ' + esc(r.model) + '</td><td class="num">' + fmt(r.pending) + ' / ' + fmt(r.reviewed) +
          '</td><td class="num">' + fmt(r.casesPending) + ' / ' + fmt(r.casesReviewed) + '</td><td class="num">' + fmt(r.errors) + '</td><td class="small">' + esc(r.message) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    $('tab-ai').innerHTML = h;
    var te = Object.keys(ai.byType);
    chart('chType', { type: 'bar', data: { labels: te, datasets: [{ data: te.map(function (k) { return ai.byType[k]; }),
      backgroundColor: te.map(function (k) { return cssVar('--' + (scoreClass(ai.byType[k]) || 'accent')); }), borderRadius: 4 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } } });
    $('btnBatch').addEventListener('click', function (e) {
      var b = e.target; b.disabled = true; b.textContent = 'กำลังตรวจ… (อาจใช้เวลาหลายนาที)';
      call('apiRunBatch').then(function (json) {
        var r = JSON.parse(json);
        toast(r.skipped || ('ตรวจแล้ว ' + r.reviewed + ' Activity, ' + (r.cases_reviewed || 0) + ' Case' + (r.errors ? ', error ' + r.errors : '')));
        load(true);
      }).catch(function (err) { toast('ไม่สำเร็จ: ' + err.message); b.disabled = false; b.textContent = 'ลองใหม่'; });
    });
  }
  function topMissing(reviewed) {
    var count = {};
    reviewed.forEach(function (a) { (a.criteria || []).forEach(function (c) { if (c.result !== 'yes') count[c.name] = (count[c.name] || 0) + (c.result === 'no' ? 1 : 0.5); }); });
    var e = sortedEntries(count).slice(0, 8);
    if (!e.length) return '<div class="muted">ยังไม่มีข้อมูล</div>';
    var max = e[0][1];
    return '<table><tbody>' + e.map(function (x) {
      return '<tr><td>' + esc(x[0]) + '</td><td style="width:120px"><div class="bar"><span style="width:' + (x[1] / max * 100) + '%"></span></div></td><td class="num">' + fmt(x[1], 1) + '</td></tr>';
    }).join('') + '</tbody></table>';
  }
  function actTable(list, empty) {
    if (!list.length) return '<div class="card muted">' + empty + '</div>';
    return '<div class="card table-wrap"><table><thead><tr><th>Activity</th><th>Case</th><th>ประเภท</th><th>Method</th><th>Buyer</th><th>คะแนน</th><th>ข้อความ</th><th>คำแนะนำ</th></tr></thead><tbody>' +
      list.map(function (a) {
        return '<tr class="clickable" data-case="' + esc(a.caseId) + '"><td>' + esc(a.id) + '</td><td>' + esc(a.caseId) + '</td><td>' + esc(a.type) +
          (a.typeMismatch ? '<div class="small muted">→ ' + esc(a.suggestedType) + '</div>' : '') + '</td><td>' + esc(a.method) + '</td><td>' + esc(nameOf(a.by)) + '</td><td>' +
          gradeBadge(a.score, a.grade, a.reviewStale) + '</td><td class="desc small">' + esc(a.desc.length > 160 ? a.desc.slice(0, 160) + '…' : a.desc) +
          '</td><td class="small">' + esc(a.suggestion) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ---------------- data health ----------------
  function renderHealth() {
    var hl = D.health;
    $('healthPill').textContent = hl.bySeverity.high || '';
    var groups = {};
    hl.issues.forEach(function (i) { (groups[i.code] = groups[i.code] || []).push(i); });
    var sevCls = { high: 'bad', medium: 'warn', low: '' };
    var sevTh = { high: 'สูง', medium: 'กลาง', low: 'ต่ำ' };
    var h = '<p class="muted small">ระบบแสดงปัญหาให้เห็นเท่านั้น และจะไม่แก้ไข DB ให้ คลิกลิงก์เพื่อเปิดแถวนั้นใน Google Sheet แล้วแก้ไขเอง</p><div class="grid kpis">' +
      kpi('ปัญหาระดับสูง', fmt(hl.bySeverity.high || 0), '', (hl.bySeverity.high ? 'bad' : 'good')) +
      kpi('ระดับกลาง', fmt(hl.bySeverity.medium || 0), '', (hl.bySeverity.medium ? 'warn' : 'good')) +
      kpi('ระดับต่ำ', fmt(hl.bySeverity.low || 0), '') + '</div>';
    Object.keys(groups).forEach(function (code) {
      var g = groups[code], r = hl.rules[code];
      h += '<h2><span class="badge ' + sevCls[r.severity] + '">' + sevTh[r.severity] + '</span> ' + esc(r.label) + ' <span class="muted">(' + g.length + ')</span></h2>' +
        '<div class="card table-wrap"><table><thead><tr><th>รายการ</th><th>Case</th><th>รายละเอียด</th><th>แก้ใน Sheet</th></tr></thead><tbody>' +
        g.map(function (i) {
          return '<tr><td>' + esc(i.recordId) + '</td><td>' + (i.caseId ? '<a href="#" data-case="' + esc(i.caseId) + '">' + esc(i.caseId) + '</a>' : '') +
            '</td><td class="small">' + esc(i.detail) + '</td><td>' + sheetLink(i.sheet, i.row, i.sheet + ' แถว ' + i.row) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    });
    if (!hl.issues.length) h += '<div class="card">ไม่พบปัญหา 🎉</div>';
    $('tab-health').innerHTML = h;
  }

  // ---------------- settings ----------------
  function renderSettings() {
    var s = D.settings;
    var prov = ['claude', 'openai', 'gemini'];
    var h = '<div class="grid cols-2"><div class="card"><h3>AI Provider</h3>' +
      '<div class="form-row"><label>Provider</label><select id="sProvider">' + prov.map(function (p) {
        return '<option value="' + p + '"' + (p === s.AI_PROVIDER ? ' selected' : '') + '>' + p + (s.keys[p] ? '' : ' (ยังไม่มี API key)') + '</option>';
      }).join('') + '</select></div>' +
      '<div class="form-row"><label>Model</label><input type="text" id="sModel" value="' + esc(s.AI_MODEL === s.defaultModels[s.AI_PROVIDER] ? '' : s.AI_MODEL) + '" placeholder="ค่าเริ่มต้น: ' + esc(s.defaultModels[s.AI_PROVIDER]) + '"></div>' +
      '<div class="form-row"><label>Effort (Claude)</label><select id="sEffort">' + ['low', 'medium', 'high'].map(function (e) {
        return '<option' + (e === s.AI_EFFORT ? ' selected' : '') + '>' + e + '</option>'; }).join('') + '</select></div>' +
      '<p class="small muted">API key ตั้งค่าใน Apps Script → Project Settings → Script Properties: ' +
      'ANTHROPIC_API_KEY ' + (s.keys.claude ? '✓' : '✗') + ' · OPENAI_API_KEY ' + (s.keys.openai ? '✓' : '✗') + ' · GEMINI_API_KEY ' + (s.keys.gemini ? '✓' : '✗') + '</p></div>' +
      '<div class="card"><h3>เกณฑ์ Dashboard</h3>' +
      numRow('STALE_DAYS', 'Case นิ่งเมื่อไม่มี Activity เกิน (วัน)') + numRow('SCORE_THRESHOLD', 'เกณฑ์คะแนน AI ขั้นต่ำ') +
      numRow('MIN_QUOTES', 'Vendor ขั้นต่ำที่ควรเทียบราคา') + numRow('SHORT_DESC_CHARS', 'คำอธิบายสั้นเกินไปถ้าน้อยกว่า (ตัวอักษร)') +
      numRow('BATCH_SIZE', 'AI ตรวจต่อรอบ (Activity)') + numRow('CASE_BATCH_SIZE', 'AI ตรวจทั้ง Case ต่อรอบ (Case)') + '</div></div>' +
      '<div class="filters" style="margin-top:12px"><button class="btn" id="btnSave">บันทึกการตั้งค่า</button>' +
      (s.storeUrl ? '<a class="small" href="' + esc(s.storeUrl) + '" target="_blank" rel="noopener">เปิด AI Store (ไฟล์แยก)</a>' : '') + '</div>';
    h += '<h2>เกณฑ์ที่ AI ใช้ตรวจ</h2><p class="small muted">เลือกเกณฑ์ตามลำดับ: ชีต <b>Criteria</b> ใน AI Store (แยกตาม Method) → hint ใน DB (Config_Settings: HINT_ACTIVITY_*) แล้วต่อท้ายด้วยเกณฑ์กลาง 3 ข้อ ' +
      'แก้เกณฑ์ SPECIAL/NORMAL ได้ที่ชีต Criteria ' + (s.storeUrl ? '(<a href="' + esc(s.storeUrl) + '" target="_blank" rel="noopener">เปิด AI Store</a>) ' : '') +
      'เมื่อแก้แล้ว ระบบจะตรวจรายการที่เกี่ยวข้องใหม่ให้อัตโนมัติ</p>';
    Object.keys(D.criteria).forEach(function (m) {
      h += '<h2>' + esc(m) + ' · ' + esc(label('METHOD', m)) + '</h2><div class="grid cols-3">' +
        Object.keys(D.criteria[m]).map(function (t) {
          var cr = D.criteria[m][t];
          return '<div class="card"><h3>' + esc(t) + '</h3><div class="small muted">ที่มา: ' + esc(cr.source) + '</div><ol class="small">' +
            cr.list.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ol></div>';
        }).join('') + '</div>';
    });
    $('tab-settings').innerHTML = h;
    $('btnSave').addEventListener('click', function (e) {
      var b = e.target; b.disabled = true;
      var payload = { AI_PROVIDER: $('sProvider').value, AI_MODEL: $('sModel').value.trim(), AI_EFFORT: $('sEffort').value };
      ['STALE_DAYS', 'SCORE_THRESHOLD', 'MIN_QUOTES', 'SHORT_DESC_CHARS', 'BATCH_SIZE', 'CASE_BATCH_SIZE'].forEach(function (k) { payload[k] = Number($('s_' + k).value); });
      call('apiSaveSettings', [payload]).then(function () { toast('บันทึกแล้ว'); load(true); })
        .catch(function (err) { toast('บันทึกไม่สำเร็จ: ' + err.message); }).then(function () { b.disabled = false; });
    });
  }
  function numRow(k, lbl) {
    return '<div class="form-row"><label for="s_' + k + '">' + esc(lbl) + '</label><input type="number" min="0" id="s_' + k + '" value="' + esc(D.settings[k]) + '"></div>';
  }

  // ---------------- load ----------------
  function renderAll() {
    $('subtitle').textContent = 'ข้อมูล ณ ' + new Date(D.generatedAt).toLocaleString('th-TH') + ' · อ่านจาก "' + D.meta.name + '" (อ่านอย่างเดียว)';
    renderOverview(); renderBuyers(); renderCases(); renderAi(); renderHealth(); renderSettings();
  }
  function load(refresh) {
    $('loading').classList.remove('hidden'); $('error').classList.add('hidden');
    $('btnRefresh').disabled = true;
    call(refresh ? 'apiRefresh' : 'apiGetDashboard').then(function (json) {
      D = JSON.parse(json);
      renderAll();
    }).catch(function (e) {
      $('error').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; $('error').classList.remove('hidden');
    }).then(function () { $('loading').classList.add('hidden'); $('btnRefresh').disabled = false; });
  }
  $('btnRefresh').addEventListener('click', function () { load(true); });
  try { var t = localStorage.getItem('dash.tab'); if (t && $('tab-' + t)) showTab(t); } catch (e) {}
  load(false);
})();
</script>
